<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NanoJev · 三方同例回放</title><link rel="stylesheet" href="./comparison.css"><script src="./comparison.js" defer></script></head>
<body>
  <main id="comparisonStage">
